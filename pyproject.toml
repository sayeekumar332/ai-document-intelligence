[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-document-intelligence"
version = "0.1.0"
description = "A local-first document question-answering application with evidence-based citations."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PyMuPDF>=1.24,<2",
    "sentence-transformers>=5.0,<6",
    "psycopg[binary]>=3.2,<4",
    "pgvector>=0.3,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
